[package]
name = "xtables_python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the xtables client."
license = "MIT"
publish = false

[lib]
test = false
doctest = false
name = "xtables"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "multiple-pymethods"] }
xtables_client = { path = "../rust" }
xtables_protobuf = { path = "../../proto", version = "0.1.0" }
