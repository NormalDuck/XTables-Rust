[package]
name = "xtables_ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI for xtables, consumed by the Java FFM client and other foreign callers."
license = "MIT"

[lib]
name = "xtables_ffi"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
xtables_client = { path = "../clients/rust" }
xtables_protobuf = { path = "../proto", version = "0.1.0" }

[build-dependencies]
cbindgen = "0.29.4"

[dev-dependencies]
xtables_server = { path = "../core" }
