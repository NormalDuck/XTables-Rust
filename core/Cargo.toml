[package]
name = "xtables_server"
version = "0.0.3"
edition = "2024"
description = "A Rust server for managing xtables over ZeroMQ."

[dependencies]
zmq = "0.10.0"
prost = "0.14.4"
clap = { version = "4.6", features = ["derive"] }
log = { version = "0.4.34", features = ["std"] }
arc-swap = "1.9"
xtables_protobuf = { path = "../proto", version = "0.0.3" }
