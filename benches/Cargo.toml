[package]
name = "benches"
version = "0.0.3"
edition = "2024"
description = "Latency and throughput harness for xtables-rust and its alternatives."
publish = false

[dependencies]
zmq = "0.10.0"
prost = "0.14.1"
hdrhistogram = { version = "7.5", default-features = false }
clap = { version = "4.5.47", features = ["derive"] }
xtables_client = { path = "../clients/rust" }
xtables_protobuf = { path = "../proto", version = "0.0.3" }
